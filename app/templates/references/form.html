{% extends "base.html" %}
{% block title %}{{ title }} — Template Maker{% endblock %}
{% block content %}
<div class="page-header">
    <h1>{{ title }}</h1>
    <div class="actions">
        <a class="btn" href="/references/{{ entity_type }}">Назад</a>
    </div>
</div>
<form id="ref-form" class="form" autocomplete="off">
    <div id="form-errors" class="errors" hidden></div>
    <div class="form-section">
        <label>Код *
            <input type="text" id="code" required>
        </label>
    </div>
    <div class="form-section">
        <label>Название *
            <input type="text" id="name" required>
        </label>
    </div>
    <div id="form-fields"></div>
    <div class="form-section">
        <label>Описание
            <textarea id="description" rows="3"></textarea>
        </label>
    </div>
    <div class="form-actions">
        <button class="btn primary" type="submit">Сохранить</button>
        {% if value_id %}<button class="btn danger" type="button" id="btn-delete">Удалить</button>{% endif %}
    </div>
</form>
<script>
    window.PAGE = { entityType: {{ entity_type | tojson }}, valueId: {{ value_id | tojson }} };
</script>
<script src="/static/js/reference-form.js"></script>
{% endblock %}
