{% extends "base.html" %}
{% block title %}Шаблоны сообщений — Template Maker{% endblock %}
{% block content %}
<div class="page-header">
    <h1>✉️ Шаблоны сообщений</h1>
    <div class="actions">
        <a class="btn primary" href="/templates/new">Загрузить шаблон</a>
    </div>
</div>
<div class="filters">
    <form class="filters-inline"
          hx-get="/templates-htmx/table"
          hx-target="#tpl-body"
          hx-swap="innerHTML"
          hx-trigger="input changed delay:200ms">
        <label>Поиск:
            <input id="search" name="search" type="search" value="{{ search | default('') }}" placeholder="по имени / описанию / категории">
        </label>
    </form>
</div>
<div class="table-wrap">
    <table class="data-table" id="tpl-table">
        <thead><tr>
            <th>Имя</th>
            <th>Формат</th>
            <th>Категория</th>
            <th>Описание / Резюме</th>
            <th>Обновлено</th>
            <th class="no-sort"></th>
        </tr></thead>
        <tbody id="tpl-body">
            {% include "partials/templates_table.html" %}
        </tbody>
    </table>
</div>
{% endblock %}
