{% extends "base.html" %}
{% block title %}Загрузить шаблон — Template Maker{% endblock %}
{% block content %}
<div class="page-header">
    <h1>⬆️ Загрузка шаблона</h1>
    <div class="actions">
        <a class="btn" href="/templater/templates">Назад</a>
    </div>
</div>

<div x-data="{
    stage: 'edit',
    showFormErrors: true,
    detectFormat(text) {
        return (text || '').trim().startsWith('<') ? 'xml' : 'json';
    },
    async readFile(file) {
        const text = await file.text();
        this.$refs.content.value = text;
        this.$refs.format.value = this.detectFormat(text);
    }
}" @template-previewed.window="stage = 'review'; showFormErrors = false">
    <form id="upload-form"
          class="form"
          x-show="stage === 'edit'"
          hx-post="/templater/templates-htmx/preview"
          hx-encoding="multipart/form-data"
          hx-target="#review-stage"
          hx-swap="innerHTML"
          hx-indicator="#upload-indicator"
          hx-disabled-elt="find button[type=submit]"
          @htmx:before-request="showFormErrors = false"
          @htmx:after-swap="showFormErrors = $event.detail.target === $refs.errors">
        <div id="form-errors" class="errors" x-ref="errors" x-show="showFormErrors"></div>
        <div class="form-section">
            <label>Имя <span class="required-mark">*</span>
                <input type="text" name="name" required>
            </label>
        </div>
        <div class="form-section">
            <label>Описание
                <textarea name="description" rows="2"></textarea>
            </label>
        </div>
        <div class="form-section">
            <label>Формат</label>
            <select name="format" x-ref="format">
                <option value="json">JSON</option>
                <option value="xml">XML</option>
            </select>
        </div>
        <div class="form-section">
            <label>Содержимое <span class="required-mark">*</span></label>
            <div class="upload-zone"
                 @dragover.prevent="$el.classList.add('dragover')"
                 @dragleave="$el.classList.remove('dragover')"
                 @drop.prevent="$el.classList.remove('dragover'); if ($event.dataTransfer.files[0]) readFile($event.dataTransfer.files[0])">
                Перетащите файл сюда, выберите файл или вставьте текст ниже
                <div style="margin-top:8px;">
                    <input type="file" accept=".json,.xml,.txt" @change="if ($event.target.files[0]) readFile($event.target.files[0])">
                </div>
            </div>
            <textarea name="content"
                      x-ref="content"
                      rows="14"
                      style="font-family: ui-monospace, Menlo, monospace; font-size: 13px; margin-top:8px;"
                      @paste="setTimeout(() => { $refs.format.value = detectFormat($refs.content.value); }, 10)"></textarea>
        </div>
        <div class="form-section">
            <p class="muted" style="margin:0;">
                Перед сохранением шаблон будет обработан LLM.
            </p>
        </div>
        <div class="form-actions">
            <button class="btn primary" type="submit">Обработать LLM</button>
            <span id="upload-indicator" class="htmx-indicator muted">
                <span class="spinner"></span> Обработка LLM…
            </span>
        </div>
    </form>

    <section id="review-stage" x-show="stage === 'review'" x-cloak></section>
</div>
{% endblock %}
