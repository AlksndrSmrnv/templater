<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Template Maker{% endblock %}</title>
    <link rel="stylesheet" href="/static/css/app.css">
    <script src="https://unpkg.com/htmx.org@2.0.4/dist/htmx.min.js"
            integrity="sha384-HGfztofotfshcF7+8n44JQL2oJmowVChPTg48S+jvZoztPfvwD79OC/LTtG6dMp+"
            crossorigin="anonymous"
            defer></script>
    <script src="https://unpkg.com/alpinejs@3.14.1/dist/cdn.min.js"
            integrity="sha384-l8f0VcPi/M1iHPv8egOnY/15TDwqgbOR1anMIJWvU6nLRgZVLTLSaNqi/TOoT5Fh"
            crossorigin="anonymous"
            defer></script>
    {% block head_extra %}{% endblock %}
</head>
<body x-data="{
    toastOpen: false,
    toastMessage: '',
    toastType: 'success',
    toastTimer: null,
    showToast(event) {
        const detail = event.detail || {};
        this.toastMessage = detail.message || detail.value || 'Готово';
        this.toastType = detail.type || 'success';
        this.toastOpen = true;
        clearTimeout(this.toastTimer);
        this.toastTimer = setTimeout(() => { this.toastOpen = false; }, 4200);
    }
}" @show-toast.window="showToast($event)" @showToast.window="showToast($event)">
<header class="topbar">
    <div class="brand"><a href="/">📝 Template Maker</a></div>
    <nav class="topnav">
        <a href="/" class="{% if active == 'home' %}active{% endif %}" title="Главная">
            <span class="nav-icon">🏠</span><span class="nav-label">Главная</span>
        </a>
        <span class="nav-group{% if active == 'data' %} active{% endif %}" title="Тестовые данные">
            <span class="nav-icon">🗂️</span><span class="nav-label">Тестовые данные</span>
            <div class="nav-submenu">
                <a href="/clients">👥 Клиенты</a>
                <a href="/accounts">🏦 Счета</a>
                <a href="/cards">💳 Карты</a>
            </div>
        </span>
        <a href="/references" class="{% if active == 'references' %}active{% endif %}" title="Справочники">
            <span class="nav-icon">📚</span><span class="nav-label">Справочники</span>
        </a>
        <a href="/templates" class="{% if active == 'templates' %}active{% endif %}" title="Шаблоны сообщений">
            <span class="nav-icon">✉️</span><span class="nav-label">Шаблоны сообщений</span>
        </a>
        <a href="/send" class="{% if active == 'send' %}active{% endif %} disabled" title="Отправка сообщений — в разработке">
            <span class="nav-icon">📨</span><span class="nav-label">Отправка сообщений</span>
        </a>
        <a href="/settings" class="{% if active == 'settings' %}active{% endif %}" title="Настройки">
            <span class="nav-icon">⚙️</span><span class="nav-label">Настройки</span>
        </a>
    </nav>
</header>
<main class="content">
    {% block content %}{% endblock %}
</main>
<div id="toast"
     class="toast"
     x-show="toastOpen"
     x-cloak
     :class="toastType"
     x-text="toastMessage"></div>
<script>
    document.body.addEventListener('htmx:beforeSwap', (e) => {
        if (e.detail.target && window.Alpine) Alpine.destroyTree(e.detail.target);
    });
    document.body.addEventListener('htmx:afterSwap', (e) => {
        if (e.detail.target && window.Alpine) Alpine.initTree(e.detail.target);
    });
    document.body.addEventListener('htmx:oobAfterSwap', (e) => {
        if (e.detail.target && window.Alpine) Alpine.initTree(e.detail.target);
    });
</script>
{% block scripts %}{% endblock %}
</body>
</html>
