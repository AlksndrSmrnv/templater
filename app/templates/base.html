<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Template Maker{% endblock %}</title>
    <link rel="stylesheet" href="/static/css/app.css">
    {% block head_extra %}{% endblock %}
</head>
<body>
<header class="topbar">
    <div class="brand"><a href="/">Template Maker</a></div>
    <nav class="topnav">
        <a href="/" class="{% if active == 'home' %}active{% endif %}">Главная</a>
        <span class="nav-group{% if active == 'data' %} active{% endif %}">
            Тестовые данные
            <div class="nav-submenu">
                <a href="/clients">Клиенты</a>
                <a href="/accounts">Счета</a>
                <a href="/cards">Карты</a>
            </div>
        </span>
        <a href="/references" class="{% if active == 'references' %}active{% endif %}">Справочники</a>
        <a href="/templates" class="{% if active == 'templates' %}active{% endif %}">Шаблоны сообщений</a>
        <a href="/send" class="{% if active == 'send' %}active{% endif %} disabled" title="В разработке">Отправка сообщений</a>
        <a href="/settings" class="{% if active == 'settings' %}active{% endif %}">Настройки</a>
    </nav>
</header>
<main class="content">
    {% block content %}{% endblock %}
</main>
<div id="toast" class="toast" hidden></div>
<script src="/static/js/app.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
