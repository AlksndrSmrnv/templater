{% if unresolved %}
    <div class="errors">
        <strong>Не подставлено:</strong> {{ unresolved | join(", ") }}
    </div>
{% endif %}
<div class="form-actions" style="margin-top:14px;">
    <form action="/templates-htmx/{{ template.id }}/fill/download" method="post">
        {% for key, value in fill_values.items() %}
            {% if value %}
                <input type="hidden" name="{{ key }}" value="{{ value }}">
            {% endif %}
        {% endfor %}
        <button class="btn" type="submit">Скачать</button>
    </form>
</div>
<h3 style="margin-top:18px;">Результат</h3>
<pre class="template-code">{{ rendered_html | safe }}</pre>
