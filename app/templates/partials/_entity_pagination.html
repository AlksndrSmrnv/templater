{% set _page = page | default(1) %}
{% set _pages = pages | default(1) %}
{% if _pages > 1 %}
    <button class="btn" type="button"
            @click="page = {{ _page - 1 }}; dispatchPage()"
            {% if not (has_prev | default(false)) %}disabled{% endif %}>← Назад</button>
    <span class="muted">Стр. {{ _page }} из {{ _pages }}</span>
    <button class="btn" type="button"
            @click="page = {{ _page + 1 }}; dispatchPage()"
            {% if not (has_next | default(false)) %}disabled{% endif %}>Вперёд →</button>
{% endif %}
