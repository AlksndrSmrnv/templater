<div id="{{ wrap_id | default('template-code-wrap') }}"
     class="template-code-wrap"
     x-data="{
         placeholders: [],
         catalog: [],
         dynamicTokens: [],
         dropdownIdx: null,
         dynamicSuggestion: null,
         search: '',
         dropdownStyle: '',
         init() {
             this.placeholders = JSON.parse(this.$refs.placeholdersSeed.value || '[]');
             this.catalog = JSON.parse(this.$refs.catalogSeed.value || '[]');
             this.dynamicTokens = JSON.parse(this.$refs.dynamicTokensSeed.value || '[]');
             this.$nextTick(() => this.refresh());
         },
         display(idx) {
             const ph = this.placeholders[idx] || {};
             return ph.mode === 'literal' ? (ph.original || '') : (ph.value || ph.original || '');
         },
         modeClass(idx) {
             return (this.placeholders[idx] || {}).mode || 'literal';
         },
         refresh() {
             this.$root.querySelectorAll('.placeholder').forEach((span) => {
                 const idx = Number(span.dataset.idx);
                 span.textContent = this.display(idx);
                 span.classList.remove('mapped', 'literal', 'dynamic');
                 span.classList.add(this.modeClass(idx));
             });
         },
         open(span, idx) {
             const ph = this.placeholders[idx] || {};
             const rect = span.getBoundingClientRect();
             this.dropdownIdx = idx;
             this.dynamicSuggestion = ph.mode === 'dynamic' && ph.suggestion ? ph.suggestion : null;
             this.search = '';
             this.dropdownStyle = `top:${window.scrollY + rect.bottom + 4}px;left:${window.scrollX + rect.left}px;`;
         },
         restoreDynamic() {
             const ph = this.placeholders[this.dropdownIdx];
             if (!ph || !this.dynamicSuggestion) return;
             ph.mode = 'dynamic';
             {% raw %}ph.value = '{{' + this.dynamicSuggestion + '}}';{% endraw %}
             ph.suggestion = this.dynamicSuggestion;
             this.dropdownIdx = null;
             this.dynamicSuggestion = null;
             this.refresh();
         },
         chooseLiteral() {
             const ph = this.placeholders[this.dropdownIdx];
             if (!ph) return;
             ph.mode = 'literal';
             ph.value = ph.original || '';
             ph.suggestion = null;
             this.dropdownIdx = null;
             this.dynamicSuggestion = null;
             this.refresh();
         },
         choose(entry) {
             const ph = this.placeholders[this.dropdownIdx];
             if (!ph) return;
             ph.mode = 'mapped';
             {% raw %}ph.value = '{{' + entry.path + '}}';{% endraw %}
             ph.suggestion = entry.path;
             this.dropdownIdx = null;
             this.dynamicSuggestion = null;
             this.refresh();
         },
         chooseDynamic(token) {
             const ph = this.placeholders[this.dropdownIdx];
             if (!ph || !token || !token.name) return;
             ph.mode = 'dynamic';
             {% raw %}ph.value = '{{' + token.name + '}}';{% endraw %}
             ph.suggestion = token.name;
             this.dropdownIdx = null;
             this.dynamicSuggestion = null;
             this.refresh();
         },
         filteredCatalog() {
             const q = this.search.trim().toLowerCase();
             if (!q) return this.catalog;
             return this.catalog.filter((entry) => (entry.path || '').toLowerCase().includes(q) || (entry.label || '').toLowerCase().includes(q));
         }
     }">
    <input type="hidden" x-ref="placeholdersSeed" value="{{ (placeholders | default([])) | tojson | forceescape }}">
    <input type="hidden" x-ref="catalogSeed" value="{{ (catalog | default([])) | tojson | forceescape }}">
    <input type="hidden" x-ref="dynamicTokensSeed" value="{{ (dynamic_tokens | default([])) | tojson | forceescape }}">
    <input type="hidden" name="{{ input_name | default('placeholders') }}" :value="JSON.stringify(placeholders)">
    <pre class="template-code"
         @click="const span = $event.target.closest('.placeholder'); if (span) { $event.stopPropagation(); open(span, Number(span.dataset.idx)); }">{{ rendered_html | safe }}</pre>
    <template x-if="dropdownIdx !== null">
        <div class="dropdown" :style="dropdownStyle" @click.outside="dropdownIdx = null; dynamicSuggestion = null;" x-cloak>
            <input type="search" x-model="search" placeholder="Поиск поля..." autocomplete="off">
            <ul>
                <template x-if="dynamicSuggestion">
                    <li @click="restoreDynamic()">
                        <strong>Использовать динамическое значение</strong>
                        <span class="path" {% raw %}x-text="'{{' + dynamicSuggestion + '}}'"{% endraw %}></span>
                    </li>
                </template>
                <li @click="chooseLiteral()">
                    <strong>Оставить исходное значение</strong>
                    <div class="path" x-text="(placeholders[dropdownIdx] || {}).original || ''"></div>
                </li>
                <template x-if="dynamicTokens.length">
                    <li class="dropdown-section-header">Динамические параметры</li>
                </template>
                <template x-for="token in dynamicTokens" :key="token.name">
                    <li @click="chooseDynamic(token)">
                        <span x-text="token.label"></span>
                        <span class="path" {% raw %}x-text="'{{' + token.name + '}}'"{% endraw %}></span>
                    </li>
                </template>
                <template x-for="entry in filteredCatalog()" :key="entry.path">
                    <li @click="choose(entry)">
                        <span x-text="entry.label"></span>
                        <span class="path" x-text="entry.path"></span>
                    </li>
                </template>
            </ul>
        </div>
    </template>
</div>
