{% extends "base.html" %}
{% block title %}Импорт данных — Template Maker{% endblock %}
{% block content %}
<div class="page-header">
    <h1>📥 Импорт данных</h1>
    <div class="actions">
        <a class="btn" href="/templater/clients">Клиенты</a>
        <a class="btn" href="/templater/templates">Шаблоны</a>
    </div>
</div>
<form id="import-form"
      class="form"
      hx-post="/templater/import-htmx"
      hx-encoding="multipart/form-data"
      hx-target="#result"
      hx-swap="innerHTML">
    <div class="form-section">
        <label>Файл выгрузки (.json) <span class="required-mark">*</span>
            <input type="file" id="file" name="file" accept=".json" required>
        </label>
    </div>
    <div class="form-section">
        <label>Политика конфликтов <span class="muted">(значение по умолчанию берётся из «Настроек»)</span></label>
        <select id="policy" name="policy">
            <option value="skip" {% if default_policy == "skip" %}selected{% endif %}>Пропускать существующие</option>
            <option value="overwrite" {% if default_policy == "overwrite" %}selected{% endif %}>Перезаписывать</option>
            <option value="fail" {% if default_policy == "fail" %}selected{% endif %}>Падать при ошибке</option>
        </select>
    </div>
    <div class="form-actions">
        <button class="btn primary" type="submit">Импортировать</button>
    </div>
</form>
<div id="result"></div>
{% endblock %}
