[project]
name = "template-maker"
version = "0.1.0"
description = "Web app for preparing test data and JSON/XML message templates"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.136.1",
    "uvicorn[standard]==0.47.0",
    "jinja2==3.1.6",
    "python-multipart==0.0.29",
    "pydantic==2.13.4",
    "pydantic-settings==2.14.1",
    "SQLAlchemy[asyncio]>=2.0.49,<2.1",
    "asyncpg==0.31.0",
    "alembic==1.18.4",
    "httpx==0.28.1",
    "gigachat==0.2.1",
    "python-dotenv==1.2.2",
    "structlog==25.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.0.3",
    "pytest-asyncio==1.3.0",
    "ruff==0.15.14",
    "mypy==2.1.0",
]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM"]
ignore = ["B008", "SIM108", "SIM105", "B904", "E501"]

[tool.mypy]
strict = true
files = ["app", "scripts", "tests"]
plugins = ["pydantic.mypy"]
show_error_codes = true

[[tool.mypy.overrides]]
module = ["gigachat", "gigachat.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.alembic]
script_location = "alembic"
